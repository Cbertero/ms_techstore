server.port=8080

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_perifericos?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Ejecutar schema.sql y data.sql al iniciar
spring.sql.init.mode=always