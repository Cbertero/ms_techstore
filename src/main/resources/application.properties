server.port=8081

# Conexion a MySQL con soporte UTF-8
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_perifericos?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

# Forzar lectura de schema.sql y data.sql en UTF-8
spring.sql.init.encoding=UTF-8

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# La sesión de BD se cierra al terminar el servicio (evita consultas ocultas en la vista)
spring.jpa.open-in-view=false
spring.sql.init.mode=always
